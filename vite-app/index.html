<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASOS — Close deals while you sleep | AI Sales Operating System</title>
  <meta name="description" content="AI agents qualify every lead, diagnose their problem, and send the perfect WhatsApp message — automatically. 14-day free trial, no credit card required.">
  <link rel="canonical" href="https://dspagenthub.com/">

  <!-- Google Search Console domain verification. Must stay in the static
       <head>: the verifier does not execute JavaScript, and removing this
       tag un-verifies the property and silently stops Search Console data. -->
  <meta name="google-site-verification" content="6wuC-FCh-C14COjK9u2_seIkFLCmgOEjnrqKZv0y3Kk">

  <!-- Open Graph / social previews. Static markup on purpose: link
       scrapers do not execute JavaScript, so runtime-injected tags
       would leave previews blank. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ASOS">
  <meta property="og:url" content="https://dspagenthub.com/">
  <meta property="og:title" content="ASOS — Close deals while you sleep">
  <meta property="og:description" content="AI agents qualify every lead, diagnose their problem, and send the perfect WhatsApp message — automatically.">
  <meta property="og:image" content="https://dspagenthub.com/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ASOS — Close deals while you sleep. The AI Sales Operating System.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ASOS — Close deals while you sleep">
  <meta name="twitter:description" content="AI agents qualify every lead, diagnose their problem, and send the perfect WhatsApp message — automatically.">
  <meta name="twitter:image" content="https://dspagenthub.com/og-cover.png">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- The font binaries come from fonts.gstatic.com, a different origin than
       the stylesheet — without this the browser pays a fresh DNS+TCP+TLS
       handshake only after the CSS has parsed. crossorigin is required:
       fonts are fetched in CORS mode, and a non-CORS preconnect opens a
       connection the font request cannot reuse. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Loaded non-render-blocking. The LCP element is the hero <h1> text, so
       a render-blocking third-party stylesheet delays the largest paint by a
       full round trip. display=swap already means text paints in the fallback
       face first, so nothing renders differently — it just renders sooner. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  </noscript>
</head>
<body class="bg-bg text-slate-100 font-sans">
  <!-- scripts/prerender.js injects the static nav + hero into #root at build
       time. It is a paint-only placeholder: React clears the container and
       renders the real tree on boot, so this is not hydration. -->
  <div id="root"></div>

  <!-- Inline and parser-blocking on purpose: it must run before the browser
       paints. A signed-in visitor to "/" gets redirected to their workspace,
       so the prerendered marketing hero would be a visible flash of the wrong
       page for them. Dropping it here costs them nothing — they were never
       going to see the landing page — and anonymous visitors, who are the
       whole point of prerendering, keep the early paint. 'asos_auth' is the
       zustand persist key from src/stores/auth.store.js. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('asos_auth') || 'null');
      if (s && s.state && s.state.token) document.getElementById('root').textContent = '';
    } catch (e) { /* private mode / corrupt value: keep the prerendered shell */ }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
